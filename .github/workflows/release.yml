name: release

# Every push to main becomes the next patch release: the highest existing
# vX.Y.Z tag plus one, starting at v0.1.0. Tags on a Go module are permanent
# once the sum database sees them, so nothing is tagged unless the tree
# builds and tests clean here first. To start a new minor or major series,
# create that tag by hand once; the automation counts on from it.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, so the tags are visible

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: never tag something broken
        run: |
          go build ./...
          go vet ./...
          go test ./...
          # The same cross-builds "build and test" runs. This gate used to
          # check the host only, so a tag went out for a tree whose darwin
          # build was already failing: the two workflows run in parallel and
          # this one never sees the other's result. A tag is permanent, so
          # the gate that guards it has to be the stricter of the two.
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=linux GOARCH=386 go build ./...
          GOOS=linux GOARCH=arm go build ./...
          # The netstack module lives in this tree but not in this module:
          # a tag that breaks it is a tag that breaks it. This is the gate on
          # the tag, so it is at least as strict as the pull request's: the
          # generated gVisor tree must match its pin and patches, and the
          # tests run under the race detector.
          (cd netstack && go build ./... && go vet . ./examples/... && go test -race ./...)
          (cd netstack && out=$(gofmt -l .); if [ -n "$out" ]; then echo "$out"; exit 1; fi)
          (cd netstack/gvisor && ./import.sh -check)

      - name: next version
        id: v
        run: |
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            next=v0.1.0
          else
            next=$(echo "$last" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
          fi
          echo "$last -> $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.v.outputs.version }}" \
            --generate-notes
